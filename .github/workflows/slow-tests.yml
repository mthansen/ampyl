name: Slow tests

on:
  schedule:
    - cron: '0 3 * * *'  # nightly at 03:00 UTC, runs on main
  workflow_dispatch:  # manual runs from the Actions tab, any branch

jobs:
  slow:

    runs-on: ubuntu-latest

    env:
      AMPYL_SLOW_TESTS: "1"

    steps:

    - name: Setup python
      uses: actions/setup-python@v5
      with:
        python-version: "3.9"
        architecture: x64

    - name: Clone repository
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install libfftw3-dev
        python -m pip install --upgrade pip
        pip install numpy scipy coverage
        pip install .

    - name: Test (full suite including slow tests)
      run: |
        cd tests
        for f in `ls *py`
        do
          coverage run -p --source ampyl $f
        done

    - name: Coverage report
      run: |
        cd tests
        coverage combine
        coverage report -m  # Print coverage report to screen
        coverage xml  # Export coverage report as XML file, for codecov.io

    - name: Upload coverage to Codecov
      env:
        CODECOV_TOKEN: "fff52416-cbeb-4926-b062-04e528abb51c"
        CODECOV_ENV: CODECOV_TOKEN
      run: |
        cd tests
        bash <(curl -s https://codecov.io/bash) -f ./coverage.xml -F full
